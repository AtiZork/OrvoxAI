---
# After Git pull, run the full build (same as: npm run deploy:cpanel)
# Edit REPO if your clone path differs.
deployment:
  tasks:
    - export REPO=/home2/orvoxaic/repositories/OrvoxAI
    - cd $REPO && npm run deploy:cpanel 2>&1 | /bin/tee -a $REPO/deploy.log
    - /bin/mkdir -p $REPO/tmp
    - /bin/touch $REPO/tmp/restart.txt
